name: Build desktop .exe

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (bundles the Windows query engine)
        run: pnpm --filter @tcg-vault/db run generate

      - name: Build the Next.js standalone server
        run: pnpm --filter @tcg-vault/web run build

      # Tauri's sidecar mechanism wants a real binary at a target-triple-suffixed
      # path — this is the portable Node runtime the bundled server.js runs on,
      # so end users never need Node installed themselves.
      - name: Download portable Node runtime for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="20.18.1"
          TARGET_TRIPLE="x86_64-pc-windows-msvc"
          DEST="apps/desktop/src-tauri/binaries"
          mkdir -p "$DEST"
          curl -fLo node.zip "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          unzip -q node.zip
          mv "node-v${NODE_VERSION}-win-x64/node.exe" "$DEST/node-${TARGET_TRIPLE}.exe"

      - name: Assemble bundled server resources
        run: pnpm --filter @tcg-vault/desktop run prepare-resources

      # With the two TAURI_SIGNING_* secrets set (see apps/desktop/README.md),
      # `tauri build` (bundle.createUpdaterArtifacts: true in tauri.conf.json)
      # automatically produces a `<installer>.exe.sig` signature file next to
      # the installer, in addition to the installer itself.
      - name: Build the signed .exe installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @tcg-vault/desktop exec tauri build

      # Hand-assembles the static update manifest the app's updater polls
      # (tauri.conf.json -> plugins.updater.endpoints): one URL/signature
      # pair for the Windows installer just built and signed above.
      - name: Assemble the updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle/nsis"
          EXE=$(ls "$BUNDLE_DIR"/*.exe | head -n1)
          EXE_NAME=$(basename "$EXE")
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          SIGNATURE=$(cat "$EXE.sig")
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$EXE_NAME" \
            --arg signature "$SIGNATURE" \
            '{version: $version, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > "$BUNDLE_DIR/latest.json"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TCG Vault ${{ github.ref_name }}"
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
