name: Build desktop .exe

on:
  push:
    tags:
      - "desktop-v*"
  # Manual runs name the release tag here (e.g. desktop-v0.1.5); the release
  # step creates it on the commit being built. Lets a release be cut without
  # pushing a tag from a machine that can't.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. desktop-v0.1.5 (must match tauri.conf.json)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # A tag like desktop-v0.1.4 on a commit whose tauri.conf.json still says
      # 0.1.3 once produced a "0.1.4" release containing a 0.1.3 build, which
      # the updater then never offered. Refuse to build that.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$RELEASE_TAG" != "desktop-v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match tauri.conf.json version $VERSION — bump the version (see apps/desktop/README.md) and tag desktop-v$VERSION."
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (bundles the Windows query engine)
        run: pnpm --filter @tcg-vault/db run generate

      - name: Build the Next.js standalone server
        run: pnpm --filter @tcg-vault/web run build

      # Tauri's sidecar mechanism wants a real binary at a target-triple-suffixed
      # path — this is the portable Node runtime the bundled server.js runs on,
      # so end users never need Node installed themselves.
      - name: Download portable Node runtime for the sidecar
        shell: bash
        run: |
          set -euo pipefail
          NODE_VERSION="20.18.1"
          TARGET_TRIPLE="x86_64-pc-windows-msvc"
          DEST="apps/desktop/src-tauri/binaries"
          mkdir -p "$DEST"
          curl -fLo node.zip "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          unzip -q node.zip
          mv "node-v${NODE_VERSION}-win-x64/node.exe" "$DEST/node-${TARGET_TRIPLE}.exe"

      - name: Assemble bundled server resources
        run: pnpm --filter @tcg-vault/desktop run prepare-resources

      # With the two TAURI_SIGNING_* secrets set (see apps/desktop/README.md),
      # `tauri build` (bundle.createUpdaterArtifacts: true in tauri.conf.json)
      # automatically produces a `<installer>.exe.sig` signature file next to
      # the installer, in addition to the installer itself.
      - name: Build the signed .exe installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @tcg-vault/desktop exec tauri build

      # Hand-assembles the static update manifest the app's updater polls
      # (tauri.conf.json -> plugins.updater.endpoints): one URL/signature
      # pair for the Windows installer just built and signed above.
      - name: Assemble the updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle/nsis"
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          BUILT=$(ls "$BUNDLE_DIR"/*.exe | head -n1)
          # Tauri names it "TCG Vault_<v>_x64-setup.exe"; GitHub turns the space
          # into a dot on upload, so a URL built from the original name 404s.
          # Rename to a space-free name first so the manifest URL is exact.
          EXE_NAME="TCG-Vault_${VERSION}_x64-setup.exe"
          mv "$BUILT" "$BUNDLE_DIR/$EXE_NAME"
          mv "$BUILT.sig" "$BUNDLE_DIR/$EXE_NAME.sig"
          EXE="$BUNDLE_DIR/$EXE_NAME"
          SIGNATURE=$(cat "$EXE.sig")
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/$EXE_NAME" \
            --arg signature "$SIGNATURE" \
            '{version: $version, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > "$BUNDLE_DIR/latest.json"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "TCG Vault ${{ env.RELEASE_TAG }}"
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
