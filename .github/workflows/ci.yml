name: CI

on:
  pull_request:
  push:
    branches:
      - claude/cool-bardeen-jdeag9

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm typecheck

      - run: pnpm test

      # Catches client components importing node-only code (webpack fails the build, tsc doesn't).
      - run: pnpm --filter @tcg-vault/web build

      # The hosted build: Next -> OpenNext -> Worker bundle (wrangler validates the config and bindings).
      - run: pnpm --filter @tcg-vault/web cf:build
      - run: pnpm --filter @tcg-vault/web exec wrangler deploy --dry-run --outdir .wrangler-dryrun
